    <style>
      /* macOS Aesthetic */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { 
        background: rgba(0, 0, 0, 0.1); 
        border-radius: 10px; 
        border: 2px solid transparent;
        background-clip: content-box;
      }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, 0.2); }
      
      .dark ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }
      .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
      
      body {
        background-color: #f5f5f7;
        color: #1d1d1f;
        -webkit-font-smoothing: antialiased;
      }
      
      .dark body {
        background-color: #000000;
        color: #f5f5f7;
      }

      .glass {
        background: rgba(255, 255, 255, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .dark .glass {
        background: rgba(28, 28, 30, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }

      .macos-card {
        background: white;
        border: 1px solid rgba(0, 0, 0, 0.05);
        border-radius: 16px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .dark .macos-card {
        background: #1c1c1e;
        border: 1px solid rgba(255, 255, 255, 0.05);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
      }

      .macos-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
      }

      .macos-btn-primary {
        background-color: #007aff;
        color: white;
        font-weight: 500;
        padding: 8px 16px;
        border-radius: 10px;
        transition: all 0.2s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      }

      .macos-btn-primary:hover {
        background-color: #0063cc;
        transform: scale(1.02);
      }

      .macos-btn-primary:active {
        transform: scale(0.98);
      }

      .macos-input {
        background: rgba(0, 0, 0, 0.03);
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 12px;
        outline: none;
        transition: all 0.2s;
      }

      .dark .macos-input {
        background: rgba(255, 255, 255, 0.05);
      }

      .macos-input:focus {
        background: white;
        border-color: #007aff;
        box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.2);
      }

      .dark .macos-input:focus {
        background: #2c2c2e;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
      .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); }

      @media print {
        .no-print, nav, aside, header, button, .shrink-0 { display: none !important; }
        main, #main-content, .flex-1 { padding: 0 !important; margin: 0 !important; width: 100% !important; overflow: visible !important; }
        .custom-scrollbar { overflow: visible !important; }
        body { background: white !important; }
      }
    </style>
